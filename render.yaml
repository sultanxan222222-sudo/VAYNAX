services:
  - type: web
    name: vaynax-server
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_PATH
        value: /var/data/vaynax.sqlite
    disk:
      name: vaynax-data
      mountPath: /var/data
      sizeGB: 1
